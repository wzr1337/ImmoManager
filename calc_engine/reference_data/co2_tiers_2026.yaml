# CO2KostAufG 10-tier model (Anlage zu § 5 CO2KostAufG), residential buildings.
# co2_per_sqm_max is the upper (exclusive) bound of the tier's CO2 kg/m2/year band;
# null means "and above" (the top, open-ended tier).
# Re-verify against the official published table each year before reuse —
# see docs/legal-requirements.md §5. This file must not be silently reused across years.
year: 2026
price_corridor_eur_per_tonne:
  min: 55
  max: 65
tiers:
  - tier_number: 1
    co2_per_sqm_max: 12
    landlord_pct: 0
    tenant_pct: 100
